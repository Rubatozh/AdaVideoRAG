[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adavideorag"
version = "0.2.0"
description = "Adaptive retrieval-augmented generation for long-video understanding"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate==1.6.0",
    "bitsandbytes==0.43.1; platform_system == 'Linux'",
    "ctranslate2==4.6.0",
    "easyocr",
    "einops",
    "eva-decord==0.6.1",
    "faster-whisper==1.1.1",
    "ftfy",
    "fvcore",
    "iopath",
    "moviepy==1.0.3",
    "nano-vectordb",
    "networkx",
    "numpy==2.2.4",
    "openai",
    "pillow",
    "pytorchvideo @ git+https://github.com/facebookresearch/pytorchvideo.git@28fe037d212663c6a24f373b94cc5d478c8c1a1d",
    "qwen-vl-utils",
    "regex",
    "tenacity",
    "tiktoken",
    "timm",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "torchvision==0.21.0",
    "tqdm",
    "transformers==4.51.3",
]

[project.scripts]
adavideorag-demo = "AdaVideoRAG:main"

[tool.setuptools]
py-modules = ["AdaVideoRAG"]

[tool.setuptools.packages.find]
include = ["adavideorag*"]
